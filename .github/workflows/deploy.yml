name: Deploy Cartvai Theme to Demo Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cartvai-theme
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Theme Assets
        run: npm run build

      - name: 🚀 Deploy Theme to Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: wp-content/themes/cartvai-theme/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            src/**
            package.json
            package-lock.json
            vite.config.js
            README.md
